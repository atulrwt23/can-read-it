# Local development infrastructure. See CLAUDE.md section 9.
# Usage: cp infra/local/.env.example infra/local/.env
#        docker compose -f infra/local/docker-compose.yml up -d
name: canreadit

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-canreadit}
      POSTGRES_USER: ${POSTGRES_USER:-canreadit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-canreadit}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8.10.2-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # S3-compatible object storage (stands in for Cloudflare R2). See ADR 0009.
  # Credentials and anonymous read access are defined in seaweedfs/s3.json.
  seaweedfs:
    image: chrislusf/seaweedfs:4.47
    # Each bucket reserves 7 volumes. The defaults (30 GB volumes, a slot count derived from free
    # disk) leave room for only one bucket on a typical laptop, so use small volumes and a fixed
    # cap. Volumes are not preallocated: disk use follows the data actually stored.
    command:
      - server
      - -dir=/data
      - -master.volumeSizeLimitMB=1024
      - -volume.max=64
      - -s3
      - -s3.config=/etc/seaweedfs/s3.json
    ports:
      - "8333:8333"
    volumes:
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
      - seaweedfs-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8333/status || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30

  # One-shot: create the media bucket, then exit.
  bucket-init:
    image: amazon/aws-cli:2.37.4
    depends_on:
      seaweedfs:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-canreadit}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-canreadit-secret}
      AWS_DEFAULT_REGION: ${S3_REGION:-us-east-1}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        aws --endpoint-url http://seaweedfs:8333 s3api head-bucket --bucket "${S3_BUCKET:-canreadit-media}" 2>/dev/null
        || aws --endpoint-url http://seaweedfs:8333 s3 mb "s3://${S3_BUCKET:-canreadit-media}"
    restart: "no"

  mailpit:
    image: axllent/mailpit:v1.31.2
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres-data:
  redis-data:
  seaweedfs-data:
