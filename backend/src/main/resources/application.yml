# Shared configuration. Environment-specific values come from environment variables
# (documented in infra/local/.env.example); the `local` profile supplies dev defaults.
spring:
  application:
    name: canreadit
  autoconfigure:
    # No username/password users: sign-in is built in the identity module (step 2).
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  threads:
    virtual:
      enabled: true
  data:
    redis:
      # Cache, view counters and rate-limit buckets: data that may be lost (docs/architecture.md).
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # Redis is never worth waiting for: counters and rate limits skip it when it is slow or down.
      connect-timeout: 2s
      timeout: 1s
  datasource:
    url: ${DB_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jpa:
    # Requests never hold a database session while rendering JSON.
    open-in-view: false
    hibernate:
      ddl-auto: none
  flyway:
    # History table lives in the first schema (public); module schemas are created on demand.
    schemas: public,identity,catalog,media,discovery,reading,modulith
    create-schemas: true
  servlet:
    multipart:
      # One image per upload request (app.media.max-upload-size is the real check).
      max-file-size: 20MB
      max-request-size: 21MB
  mail:
    # SMTP (Resend in the beta, Mailpit locally). Empty host: emails are logged, not sent.
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:true}
      mail.smtp.starttls.required: ${SMTP_STARTTLS:true}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
  modulith:
    events:
      jdbc:
        schema: modulith
        schema-initialization:
          enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  health:
    mail:
      # An email outage must not mark the API down (deploys would roll back); sending failures are logged.
      enabled: false

springdoc:
  paths-to-match: /api/**

logging:
  pattern:
    level: "%5p [%X{requestId:-}]"

app:
  brand:
    name: CanReadIt
  mail:
    from: ${MAIL_FROM:CanReadIt <no-reply@canreadit.local>}
  cookies:
    # Off only for local development over plain HTTP.
    secure: true
  auth:
    access-token-ttl: 15m
    refresh-token-ttl: 30d
    jwt:
      issuer: canreadit
      # ES256 key, base64 PKCS#8 DER (docs/deploy.md). Empty: a new key at every start (sessions end on restart).
      private-key: ${AUTH_JWT_PRIVATE_KEY:}
    # Verified emails that become ADMIN at sign-in (comma-separated). Empty: nobody does.
    admin-emails: ${ADMIN_EMAILS:}
    # How long sign-in events stay in identity.auth_events. TODO(product): confirm the window.
    event-retention: 180d
    # Social sign-in (OpenID Connect). A provider is off until it has client IDs (comma-separated).
    oidc:
      google:
        issuers: https://accounts.google.com,accounts.google.com
        jwks-url: https://www.googleapis.com/oauth2/v3/certs
        audiences: ${GOOGLE_CLIENT_IDS:}
      apple:
        issuers: https://appleid.apple.com
        jwks-url: https://appleid.apple.com/auth/keys
        audiences: ${APPLE_CLIENT_IDS:}
    turnstile:
      # Empty: the bot check on sign-up is off.
      secret-key: ${TURNSTILE_SECRET_KEY:}
      verify-url: https://challenges.cloudflare.com/turnstile/v0/siteverify
  rate-limits:
    # Per-client limits on public endpoints, kept in Redis (shared.RateLimiter).
    enabled: ${RATE_LIMITS_ENABLED:true}
  web:
    # Where the API asks the web app to refresh cached pages (empty: pages refresh on their timers).
    revalidate-url: ${WEB_REVALIDATE_URL:}
    revalidate-secret: ${REVALIDATE_SECRET:}
  media:
    public-base-url: ${MEDIA_PUBLIC_BASE_URL}
    s3:
      endpoint: ${S3_ENDPOINT:}
      region: ${S3_REGION:us-east-1}
      bucket: ${S3_BUCKET}
      access-key: ${S3_ACCESS_KEY}
      secret-key: ${S3_SECRET_KEY}
