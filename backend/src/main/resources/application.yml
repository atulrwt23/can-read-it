# Shared configuration. Environment-specific values come from environment variables
# (documented in infra/local/.env.example); the `local` profile supplies dev defaults.
spring:
  application:
    name: canreadit
  autoconfigure:
    # No username/password users: sign-in is built in the identity module (step 2).
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  threads:
    virtual:
      enabled: true
  data:
    redis:
      # Cache, view counters and rate-limit buckets: data that may be lost (docs/architecture.md).
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # Redis is never worth waiting for: counters and rate limits skip it when it is slow or down.
      connect-timeout: 2s
      timeout: 1s
  datasource:
    url: ${DB_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jpa:
    # Requests never hold a database session while rendering JSON.
    open-in-view: false
    hibernate:
      ddl-auto: none
  flyway:
    # History table lives in the first schema (public); module schemas are created on demand.
    schemas: public,identity,catalog,media,discovery,modulith
    create-schemas: true
  modulith:
    events:
      jdbc:
        schema: modulith
        schema-initialization:
          enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  paths-to-match: /api/**

logging:
  pattern:
    level: "%5p [%X{requestId:-}]"

app:
  brand:
    name: CanReadIt
  cookies:
    # Off only for local development over plain HTTP.
    secure: true
  auth:
    access-token-ttl: 15m
    refresh-token-ttl: 30d
    jwt:
      issuer: canreadit
      # ES256 key, base64 PKCS#8 DER (docs/deploy.md). Empty: a new key at every start (sessions end on restart).
      private-key: ${AUTH_JWT_PRIVATE_KEY:}
    turnstile:
      # Empty: the bot check on sign-up is off.
      secret-key: ${TURNSTILE_SECRET_KEY:}
      verify-url: https://challenges.cloudflare.com/turnstile/v0/siteverify
  rate-limits:
    # Per-client limits on public endpoints, kept in Redis (shared.RateLimiter).
    enabled: ${RATE_LIMITS_ENABLED:true}
  web:
    # Where the API asks the web app to refresh cached pages (empty: pages refresh on their timers).
    revalidate-url: ${WEB_REVALIDATE_URL:}
    revalidate-secret: ${REVALIDATE_SECRET:}
  media:
    public-base-url: ${MEDIA_PUBLIC_BASE_URL}
    s3:
      endpoint: ${S3_ENDPOINT:}
      region: ${S3_REGION:us-east-1}
      bucket: ${S3_BUCKET}
      access-key: ${S3_ACCESS_KEY}
      secret-key: ${S3_SECRET_KEY}
