# Integration tests run scheduled jobs by calling them directly, so they don't fire on their own.
app:
  scheduling:
    enabled: false
  auth:
    # Signing in with this verified email grants ADMIN (the staff tests use it).
    admin-emails: admin@example.com
  notifications:
    # Links in new-chapter emails; without a site, digests wait.
    site-url: https://canreadit.test
